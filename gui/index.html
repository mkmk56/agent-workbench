<!doctype html>
<html lang="zh-CN" data-theme="light" data-astryx-theme="agent-workbench">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Agent Workbench</title>
    <script>
      /* Pre-paint theme: same logic as lib/theme.ts initialTheme(). Sets
       * data-theme before first paint so a dark-theme user never flashes
       * the light theme (and vice versa). The main-process window
       * background is dark (#090A0B), so this must match it for dark. */
      try {
        var t = localStorage.getItem('agent-workbench.theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
